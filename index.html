<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nine Lives</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b1e; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #1b1740; max-width: 100vw; max-height: 100vh; image-rendering: auto; }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<script>
/* =====================================================================
   NINE LIVES - a cat endless runner.
   HOW A GAME WORKS (the one idea behind everything below):
     Every frame (60x per second) we do three things:
       1. update()  - move things, check collisions, change the score
       2. draw()    - paint everything on the screen
       3. repeat
   Everything else is just details of those two steps.
   ===================================================================== */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = 370;              // y position of the rooftop

// ---------- TUNING: change these numbers to change how the game feels ----------
const MAX_LIVES    = 9;          // try 3 for a harder game!
const GRAVITY      = 2200;       // how fast the cat falls
const JUMP_POWER   = 780;        // how high the cat jumps
const START_SPEED  = 300;        // how fast the world scrolls at the start
const MAX_SPEED    = 720;        // the speed limit as the game ramps up
const INVULN_TIME  = 1.5;        // seconds of protection after getting hurt

// ---------- game state ----------
let state = 'title';             // 'title' | 'playing' | 'dead'
let cat, obstacles, fishes, particles, speed, distance, fishCount, lives, spawnTimer, fishTimer, shake, time = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('nl_best') || '0', 10); } catch (e) {}

// ---------- sound (tiny synthesized beeps, no audio files needed) ----------
let audioCtx = null;
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  jump:  () => beep(380, 0.14, 'square', 0.05, 260),
  fish:  () => { beep(880, 0.07, 'triangle', 0.08); setTimeout(() => beep(1320, 0.1, 'triangle', 0.08), 60); },
  hurt:  () => beep(220, 0.35, 'sawtooth', 0.09, -180),
  life:  () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.09), i * 80)); },
  over:  () => { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sawtooth', 0.08), i * 200)); },
};

// ---------- start / reset ----------
function newGame() {
  cat = { x: 120, y: GROUND, vy: 0, w: 46, h: 34, onGround: true, jumps: 0, invuln: 0, anim: 0 };
  obstacles = []; fishes = []; particles = [];
  speed = START_SPEED; distance = 0; fishCount = 0; lives = MAX_LIVES;
  spawnTimer = 1.2; fishTimer = 0.8; shake = 0;
  state = 'playing';
}

// ---------- input: keyboard, mouse and touch all do the same thing ----------
function jump() {
  audioCtx && audioCtx.state === 'suspended' && audioCtx.resume();
  if (state === 'title') { newGame(); return; }
  if (state === 'dead') { if (deadTimer > 0.6) newGame(); return; }
  if (cat.jumps < 2) {                         // allows a double jump
    cat.vy = -JUMP_POWER * (cat.jumps === 0 ? 1 : 0.85);
    cat.onGround = false; cat.jumps++;
    sfx.jump();
    puff(cat.x + 10, cat.y, 6, '#ffffff55');
  }
}
let deadTimer = 0;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) jump(); }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

// ---------- spawning ----------
function spawnObstacle() {
  const r = Math.random();
  const x = W + 40;
  if (r < 0.45) {        // a mean dog on the ground - jump over it
    obstacles.push({ kind: 'dog', x, y: GROUND, w: 54, h: 44 });
  } else if (r < 0.75) { // a flowerpot - small hop
    obstacles.push({ kind: 'pot', x, y: GROUND, w: 30, h: 32 });
  } else if (r < 0.9) {  // a bird flying at head height - jump over or run under
    obstacles.push({ kind: 'bird', x, y: GROUND - 60 - Math.random() * 60, w: 40, h: 22, flap: 0 });
  } else {               // a double dog - needs a double jump!
    obstacles.push({ kind: 'dog', x, y: GROUND, w: 54, h: 44 });
    obstacles.push({ kind: 'dog', x: x + 62, y: GROUND, w: 54, h: 44 });
  }
}
function spawnFish() {
  const gold = Math.random() < 0.06 && lives < MAX_LIVES;   // rare golden fish = extra life!
  const y = GROUND - 30 - Math.random() * 150;
  const count = gold ? 1 : 1 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    fishes.push({ x: W + 40 + i * 44, y: y - Math.sin(i * 0.9) * 22, r: 14, gold, got: false });
  }
}

// ---------- particles (little sparkles/puffs) ----------
function puff(x, y, n, color, power = 120) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * power, vy: -Math.random() * power, life: 0.5 + Math.random() * 0.4, max: 0.9, color });
  }
}

// ---------- collision: do two rectangles overlap? ----------
function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// ---------- losing a life ----------
function hurt() {
  lives--;
  shake = 0.4;
  sfx.hurt();
  puff(cat.x + 20, cat.y - 15, 24, '#ff5d73', 320);
  if (lives <= 0) {
    state = 'dead'; deadTimer = 0; sfx.over();
    const score = Math.floor(distance / 10) + fishCount * 50;
    if (score > best) { best = score; try { localStorage.setItem('nl_best', String(best)); } catch (e) {} }
  } else {
    cat.invuln = INVULN_TIME;
    cat.vy = -420; cat.onGround = false;     // knocked up a little
  }
}
const getScore = () => Math.floor(distance / 10) + fishCount * 50;

// ====================== UPDATE (the game logic) ======================
function update(dt) {
  time += dt;
  if (state === 'dead') deadTimer += dt;
  if (state !== 'playing') { particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }); particles = particles.filter(p => p.life > 0); return; }

  speed = Math.min(MAX_SPEED, speed + 6 * dt);        // the world gets faster
  distance += speed * dt;
  if (shake > 0) shake -= dt;

  // the cat: gravity + landing
  cat.vy += GRAVITY * dt;
  cat.y += cat.vy * dt;
  if (cat.y >= GROUND) { cat.y = GROUND; cat.vy = 0; if (!cat.onGround) puff(cat.x + 20, GROUND, 5, '#ffffff44', 80); cat.onGround = true; cat.jumps = 0; }
  if (cat.invuln > 0) cat.invuln -= dt;
  cat.anim += dt * speed * 0.03;

  // spawn obstacles & fish on timers - gets quicker with speed
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnObstacle(); spawnTimer = (0.9 + Math.random() * 1.1) * (START_SPEED / speed) * 1.25 + 0.35; }
  fishTimer -= dt;
  if (fishTimer <= 0) { spawnFish(); fishTimer = 1.2 + Math.random() * 1.4; }

  // move + collide obstacles. The hitbox is a bit smaller than the picture so it feels fair.
  const catBox = { x: cat.x + 6, y: cat.y - cat.h + 4, w: cat.w - 12, h: cat.h - 6 };
  for (const o of obstacles) {
    o.x -= speed * dt;
    if (o.kind === 'bird') o.flap += dt * 12;
    const box = { x: o.x + 4, y: o.y - o.h + 3, w: o.w - 8, h: o.h - 5 };
    if (cat.invuln <= 0 && hit(catBox, box)) hurt();
  }
  obstacles = obstacles.filter(o => o.x > -120);

  // fish
  for (const f of fishes) {
    f.x -= speed * dt;
    if (!f.got && Math.hypot(f.x - (cat.x + 24), f.y - (cat.y - 17)) < f.r + 22) {
      f.got = true;
      if (f.gold) { lives = Math.min(MAX_LIVES, lives + 1); sfx.life(); puff(f.x, f.y, 22, '#ffd447', 260); }
      else { fishCount++; sfx.fish(); puff(f.x, f.y, 8, '#7fd6ff', 140); }
    }
  }
  fishes = fishes.filter(f => f.x > -60 && !f.got);

  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
}

// ====================== DRAW (the pictures) ======================
const stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * 220, s: Math.random() * 1.8 + 0.4 }));
// a city skyline made of random buildings, generated once
const skyline = [0.35, 0.6].map(layer => {
  const b = []; let x = 0;
  while (x < W * 2) { const w = 40 + Math.random() * 70, h = 60 + Math.random() * 150; b.push({ x, w, h }); x += w + Math.random() * 10; }
  return { layer, b, total: x };
});

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#120f33'); g.addColorStop(1, '#4a2c6b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (const s of stars) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 2 + s.x); ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  // moon
  ctx.fillStyle = '#fff6d6'; ctx.beginPath(); ctx.arc(660, 90, 38, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8dfb8'; ctx.beginPath(); ctx.arc(648, 80, 8, 0, 7); ctx.arc(672, 104, 6, 0, 7); ctx.fill();
  // parallax buildings: far ones scroll slower than near ones (this is what fakes depth)
  const scroll = state === 'title' ? time * 60 : distance;
  skyline.forEach((L, i) => {
    ctx.fillStyle = i === 0 ? '#2a1f52' : '#1e1640';
    const off = (scroll * L.layer) % L.total;
    for (const bd of L.b) {
      for (const k of [0, 1]) {
        const x = bd.x - off + k * L.total;
        if (x > -bd.w && x < W) {
          ctx.fillRect(x, GROUND - bd.h * (i ? 1 : 0.8), bd.w, bd.h * 2);
          ctx.fillStyle = '#ffd44766';
          for (let wy = GROUND - bd.h * (i ? 1 : 0.8) + 10; wy < GROUND - 14; wy += 24)
            for (let wx = x + 8; wx < x + bd.w - 10; wx += 16) if (((wx * 7 + wy * 13) | 0) % 5 === 0) ctx.fillRect(wx, wy, 6, 9);
          ctx.fillStyle = i === 0 ? '#2a1f52' : '#1e1640';
        }
      }
    }
  });
  // rooftop
  ctx.fillStyle = '#0a0817'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#2d2352'; ctx.fillRect(0, GROUND, W, 6);
  const scroll2 = state === 'title' ? time * 300 : distance;
  ctx.fillStyle = '#1a1438';
  for (let x = -((scroll2) % 80); x < W; x += 80) ctx.fillRect(x, GROUND + 22, 44, 5);
}

function drawCat(x, y, anim, onGround, dead) {
  ctx.save(); ctx.translate(x, y);
  if (dead) { ctx.translate(46, -50); ctx.rotate(Math.PI); }   // flip the cat upside down, staying on the roof
  const bob = onGround ? Math.abs(Math.sin(anim)) * 2 : 0;
  ctx.translate(0, -bob);
  const fur = '#f2a14a', dark = '#c97a2a';
  // tail
  ctx.strokeStyle = fur; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(4, -22); ctx.quadraticCurveTo(-16, -28 - Math.sin(anim * 1.5) * 8, -10, -44); ctx.stroke();
  // legs (they swing while running)
  ctx.strokeStyle = dark; ctx.lineWidth = 6;
  const sw = onGround ? Math.sin(anim * 1.6) * 9 : 10;
  ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(10 + sw, 0); ctx.moveTo(34, -10); ctx.lineTo(34 - sw, 0); ctx.stroke();
  ctx.strokeStyle = fur;
  ctx.beginPath(); ctx.moveTo(16, -10); ctx.lineTo(16 - sw, 0); ctx.moveTo(40, -10); ctx.lineTo(40 + sw, 0); ctx.stroke();
  // body
  ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(24, -20, 22, 13, 0, 0, 7); ctx.fill();
  ctx.fillStyle = dark; ctx.fillRect(14, -32, 4, 8); ctx.fillRect(24, -33, 4, 9);   // stripes
  // head
  ctx.fillStyle = fur; ctx.beginPath(); ctx.arc(44, -28, 12, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(35, -36); ctx.lineTo(37, -50); ctx.lineTo(45, -39); ctx.fill();   // ears
  ctx.beginPath(); ctx.moveTo(53, -37); ctx.lineTo(53, -51); ctx.lineTo(44, -39); ctx.fill();
  // face
  ctx.fillStyle = '#111';
  if (dead) { ctx.font = 'bold 11px sans-serif'; ctx.fillText('x', 43, -26); ctx.fillText('x', 49, -26); }
  else { ctx.beginPath(); ctx.arc(46, -29, 2, 0, 7); ctx.arc(52, -29, 2, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ff8fa3'; ctx.fillRect(51, -25, 3, 2);
  ctx.restore();
}

function drawObstacle(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.kind === 'dog') {
    ctx.fillStyle = '#6b4a35'; ctx.fillRect(0, -30, 44, 22);          // body
    ctx.fillRect(34, -42, 20, 18);                                       // head
    ctx.fillStyle = '#3b2819'; ctx.fillRect(8, -8, 7, 8); ctx.fillRect(32, -8, 7, 8);  // legs
    ctx.fillRect(34, -48, 7, 10);                                         // ear
    ctx.fillStyle = '#fff'; ctx.fillRect(44, -36, 4, 4);                  // eye
    ctx.fillStyle = '#c00'; ctx.fillRect(40, -26, 14, 3);                 // mouth
    ctx.fillStyle = '#fff'; ctx.fillRect(44, -24, 2, 3); ctx.fillRect(50, -24, 2, 3);
  } else if (o.kind === 'pot') {
    ctx.fillStyle = '#b5532f'; ctx.beginPath(); ctx.moveTo(2, -22); ctx.lineTo(28, -22); ctx.lineTo(24, 0); ctx.lineTo(6, 0); ctx.fill();
    ctx.fillRect(0, -28, 30, 7);
    ctx.fillStyle = '#3f9d4a'; ctx.beginPath(); ctx.arc(15, -34, 8, 0, 7); ctx.fill();
  } else if (o.kind === 'bird') {
    ctx.fillStyle = '#d7d7ea'; ctx.beginPath(); ctx.ellipse(20, -11, 14, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(4, -12); ctx.lineTo(-6, -9); ctx.lineTo(4, -7); ctx.fill();
    ctx.fillStyle = '#a9a9c6'; const f = Math.sin(o.flap) * 12;
    ctx.beginPath(); ctx.moveTo(14, -14); ctx.lineTo(26, -14); ctx.lineTo(22, -14 - 12 - f); ctx.fill();
    ctx.fillStyle = '#111'; ctx.fillRect(8, -14, 3, 3);
  }
  ctx.restore();
}

function drawFish(f) {
  ctx.save(); ctx.translate(f.x, f.y + Math.sin(time * 5 + f.x * 0.05) * 3);
  ctx.fillStyle = f.gold ? '#ffd447' : '#7fd6ff';
  if (f.gold) { ctx.shadowColor = '#ffd447'; ctx.shadowBlur = 18; }
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, -8); ctx.lineTo(22, 8); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#111'; ctx.fillRect(-8, -3, 3, 3);
  ctx.restore();
}

// the row of 9 paw prints at the top: bright = life left, dark = life lost
function drawLives() {
  for (let i = 0; i < MAX_LIVES; i++) {
    const x = 24 + i * 28, y = 28, on = i < lives;
    ctx.fillStyle = on ? '#ff8fb1' : '#ffffff22';
    ctx.beginPath(); ctx.ellipse(x, y + 3, 8, 6, 0, 0, 7); ctx.fill();
    [[-7, -5], [-2.5, -9], [2.5, -9], [7, -5]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x + dx, y + dy + 3, 2.6, 0, 7); ctx.fill(); });
  }
}

function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`; ctx.textAlign = align;
  ctx.fillStyle = '#00000088'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
  drawBackground();

  if (state === 'title') {
    drawCat(W / 2 - 23, GROUND, time * 9, true, false);
    text('NINE LIVES', W / 2, 150, 72, '#ffd447');
    text('You are a cat. You have 9 lives. Use them wisely.', W / 2, 195, 20, '#e6dcff');
    text(Math.floor(time * 2) % 2 ? 'TAP  /  SPACE  to start' : ' ', W / 2, 260, 28);
    text('Tap again in mid-air to double jump  •  Golden fish = +1 life', W / 2, 300, 16, '#b9a9e8');
    if (best) text('Best: ' + best, W / 2, 335, 20, '#7fd6ff');
  } else {
    obstacles.forEach(drawObstacle);
    fishes.forEach(drawFish);
    if (state === 'dead') drawCat(cat.x, cat.y, 0, true, true);
    else if (cat.invuln <= 0 || Math.floor(time * 14) % 2) drawCat(cat.x, cat.y, cat.anim, cat.onGround, false);
    particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
    ctx.globalAlpha = 1;
    drawLives();
    text(String(getScore()), W - 20, 40, 32, '#fff', 'right');
    text('🐟 ' + fishCount, W - 20, 70, 18, '#7fd6ff', 'right');
    if (state === 'dead') {
      ctx.fillStyle = '#000000aa'; ctx.fillRect(0, 0, W, H);
      text('ALL NINE LIVES USED', W / 2, 160, 50, '#ff5d73');
      text('Score: ' + getScore(), W / 2, 215, 34);
      text(getScore() >= best ? 'NEW BEST!' : 'Best: ' + best, W / 2, 255, 24, '#ffd447');
      if (deadTimer > 0.6) text('TAP  /  SPACE  to try again', W / 2, 320, 26);
    }
  }
  ctx.restore();
}

// ====================== THE GAME LOOP ======================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);   // seconds since last frame (capped so lag can't break physics)
  last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
newGame(); state = 'title';
requestAnimationFrame(frame);
</script>
</body>
</html>
